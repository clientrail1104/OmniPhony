          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: path
        name: provider
        required: true
        schema:
          enum:
          - meta
          - telegram
          - sms
          - email
          - chatwoot
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Provider-specific signed payload; normalize after verified
                durable receipt.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        error: *id003
      required:
      - error
    Actor:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        tenantId: *id002
        role: &id007
          enum:
          - SUPER_ADMIN
          - TENANT_ADMIN
          - QUEUE_MANAGER
          - BILLING_AUDITOR
          - AGENT
      required:
      - id
      - tenantId
      - role
    Wallet:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        balance: &id004
          type: string
          pattern: ^-?\d+\.\d{6}$
          description: Exact decimal string, never JSON floating point
        reserved: *id004
        creditLimit: *id004
        available: *id004
        version:
          type: integer
      required:
      - id
      - currency
      - balance
      - reserved
      - creditLimit
      - available
      - version
    PresenceRequest:
      type: object
      additionalProperties: false
      properties:
        status:
          enum:
          - AVAILABLE
          - BREAK
          - WRAP_UP
          - OFFLINE
        version:
          type: integer
          minimum: 0
      required:
      - status
      - version
    Presence:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        presence:
          enum:
          - AVAILABLE
          - BUSY
          - BREAK
          - WRAP_UP
          - OFFLINE
        version:
          type: integer
      required:
      - id
      - presence
      - version
    QuoteRequest:
      type: object
      additionalProperties: false
      properties:
        cardId: *id002
        destination: &id005
          type: string
          pattern: ^\+[1-9][0-9]{1,14}$
        durationMs:
          type: integer
          minimum: 0
          maximum: 604800000
      required:
      - cardId
      - destination
      - durationMs
    Quote:
      type: object
      additionalProperties: false
      properties:
        rateId: *id002
        version:
          type: integer
        currency: *id003
        durationMs:
          type: integer
        billableMs:
          type: integer
        amount: *id004
        estimate:
          const: true
      required:
      - rateId
      - version
      - currency
      - durationMs
      - billableMs
      - amount
      - estimate
    Job:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        status:
          enum:
          - PENDING
          - RUNNING
          - SUCCEEDED
          - FAILED
        createdAt: &id006
          type: string
          format: date-time
        error:
          type:
          - string
          - 'null'
      required:
      - id
      - status
      - createdAt
    CallCommand:
      type: object
      additionalProperties: false
      properties:
        callId: *id002
        action:
          enum:
          - HOLD
          - RESUME
          - BLIND_TRANSFER
          - WARM_TRANSFER
          - DTMF
          - HANGUP
        target: *id003
        consultCallId: *id002
        expectedVersion:
          type: integer
          minimum: 0
      required:
      - callId
      - action
      - expectedVersion
    Originate:
      type: object
      additionalProperties: false
      properties:
        destination: *id005
        queueId: *id002
        walletId: *id002
        callerId: *id005
      required:
      - destination
      - queueId
      - walletId
    Supervision:
      type: object
      additionalProperties: false
      properties:
        callId: *id002
        mode:
          enum:
          - MONITOR
          - WHISPER
          - BARGE
          - TERMINATE
        reason:
          type: string
          minLength: 5
          maxLength: 500
      required:
      - callId
      - mode
      - reason
    Flow:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        name: *id003
        version:
          type: integer
          minimum: 1
        graph:
          $ref: ./flow.schema.json
        publishedAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - name
      - version
      - graph
    Callback:
      type: object
      additionalProperties: false
      properties:
        queueId: *id002
        callId: *id002
        destination: *id005
        consent:
          const: true
      required:
      - queueId
      - callId
      - destination
      - consent
    Message:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        conversationId: *id002
        direction:
          enum:
          - INBOUND
          - OUTBOUND
        body: *id003
        mediaObjectKey: *id003
        createdAt: *id006
      required:
      - id
      - conversationId
      - direction
      - createdAt
    SendMessage:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          maxLength: 10000
        attachmentIds:
          type: array
          items: *id002
          maxItems: 10
        template:
          type: object
          additionalProperties: false
          properties:
            name: *id003
            language: *id003
            parameters:
              type: array
              items: *id003
          required:
          - name
          - language
    ChannelCredential:
      type: object
      additionalProperties: false
      properties:
        channel:
          enum:
          - WHATSAPP
          - FACEBOOK
          - INSTAGRAM
          - TELEGRAM
          - SMS
          - EMAIL
          - WEBCHAT
        providerAccountId: *id003
        secret:
          type: string
          writeOnly: true
      required:
      - channel
      - providerAccountId
      - secret
    ChannelStatus:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        channel: *id003
        providerAccountId: *id003
        enabled:
          type: boolean
        rotatedAt: *id006
      required:
      - id
      - channel
      - enabled
    Invoice:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        number: *id003
        periodStart: *id006
        periodEnd: *id006
        currency: *id003
        subtotal: *id004
        tax: *id004
        total: *id004
        state:
          enum:
          - DRAFT
          - ISSUED
          - VOID
        downloadUrl:
          type: string
          format: uri
      required:
      - id
      - number
      - currency
      - total
      - state
    Period:
      type: object
      additionalProperties: false
      properties:
        walletId: *id002
        periodStart: *id006
        periodEnd: *id006
      required:
      - walletId
      - periodStart
      - periodEnd
    CallLog:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        switchId: *id003
        destination: *id005
        startedAt: *id006
        answeredAt:
          type:
          - string
          - 'null'
          format: date-time
        endedAt:
          type:
          - string
          - 'null'
          format: date-time
        durationMs:
          type: string
          pattern: ^\d+$
        billableMs:
          type: string
          pattern: ^\d+$
        currency: *id003
        cost: *id004
        sell: *id004
        hangupCause: *id003
      required:
      - id
      - switchId
      - destination
      - startedAt
      - durationMs
      - currency
      - sell
    Conversation:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        channel: *id003
        status:
          enum:
          - OPEN
          - PENDING
          - RESOLVED
        assignedUserId:
          type:
          - string
          - 'null'
          format: uuid
        queueId: *id002
        lastMessageAt: *id006
      required:
      - id
      - channel
      - status
    Wallboard:
      type: object
      additionalProperties: false
      properties:
        queueId: *id002
        asOf: *id006
        waiting:
          type: integer
        oldestWaitSeconds:
          type: number
        averageAnsweredWaitSeconds:
          type:
          - number
          - 'null'
        slaPercent:
          type:
          - number
          - 'null'
        slaTargetSeconds:
          type: integer
        shortAbandonThresholdSeconds:
          type: integer
        availableAgents:
          type: integer
        activeCalls:
          type: integer
      required:
      - queueId
      - asOf
      - waiting
      - slaTargetSeconds
    Transcript:
      type: object
      additionalProperties: false
      properties:
        callId: *id002
        segments:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              startMs:
                type: integer
              endMs:
                type: integer
              speaker: *id003
              text: *id003
              final:
                type: boolean
            required:
            - startMs
            - endMs
            - speaker
            - text
            - final
      required:
      - callId
      - segments
    RateImport:
      type: object
      additionalProperties: false
      properties:
        sha256: *id003
        cards:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id: *id002
              name: *id003
              version:
                type: integer
              rows:
                type: integer
            required:
            - id
            - name
            - version
            - rows
      required:
      - sha256
      - cards
    Queue:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        name: *id003
        language: *id003
        slaSeconds:
          type: integer
          minimum: 1
        wrapUpSeconds:
          type: integer
          minimum: 0
        flowId: *id002
      required:
      - name
      - slaSeconds
    User:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        oidcSubject: *id003
        email:
          type: string
          format: email
        displayName: *id003
        role: *id007
        disabled:
          type: boolean
      required:
      - oidcSubject
      - email
      - displayName
      - role
    Trunk:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        name: *id003
        gatewayName: *id003
        credentialRef: *id003
        costCardId: *id002
        maxChannels:
          type: integer
          minimum: 1
        maxCps:
          type: integer
          minimum: 1
        enabled:
          type: boolean
      required:
      - name
      - gatewayName
      - credentialRef
      - costCardId
      - maxChannels
      - maxCps
    RecordingLink:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
        expiresAt: *id006
      required:
      - url
      - expiresAt
    WsTicket:
      type: object
      additionalProperties: false
      properties:
        ticket: *id003
        expiresIn:
          type: integer
      required:
      - ticket
      - expiresIn
    TurnCredentials:
      type: object
      additionalProperties: false
      properties:
        expiresAt:
          type: integer
        iceServers:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              urls:
                type: array
                items: *id003
              username: *id003
              credential: *id003
            required:
            - urls
            - username
            - credential
      required:
      - expiresAt
      - iceServers
    CallLogPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CallLog'
        nextCursor:
          type:
          - string
          - 'null'
      required:
      - items
      - nextCursor
    ConversationPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        nextCursor:
          type:
          - string
          - 'null'
      required:
      - items
      - nextCursor
