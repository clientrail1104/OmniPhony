# Control-plane deployment TEMPLATE. See docs/DEPLOYMENT.md before use.
# No floating upstream images: .env must supply reviewed release digests.
# Media roles deploy with deploy/media.compose.yml on separate Linux hosts.
name: omni500
x-app: &app
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: 20m, max-file: "5"}
services:
  postgres:
    <<: *app
    image: ${POSTGRES_IMAGE:?Set pgvector PostgreSQL 16 image by digest}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_admin_password
      POSTGRES_DB: omni
    secrets: [pg_admin_password]
    volumes: [postgres:/var/lib/postgresql/data]
    networks: [data]
    shm_size: 1gb
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d omni"]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    <<: *app
    image: ${REDIS_IMAGE:?Set reviewed Redis OSS digest; see license notes}
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    volumes: [redis:/data, ./deploy/redis.conf:/usr/local/etc/redis/redis.conf:ro]
    secrets: [redis_acl]
    networks: [data]
  api:
    <<: *app
    build: {context: ., dockerfile: apps/api/Dockerfile}
    env_file: [./secrets/api.env]
    networks: [data, frontend]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
  web:
    <<: *app
    build: {context: ., dockerfile: apps/web/Dockerfile}
    networks: [frontend]
  proxy:
    <<: *app
    image: ${NGINX_IMAGE:?Set reviewed nginx digest}
    ports: ["443:443"]
    volumes: [./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro, ./certs:/etc/nginx/certs:ro]
    networks: [frontend]
    depends_on: [api, web]
  chatwoot:
    <<: *app
    image: ${CHATWOOT_IMAGE:?Set reviewed Chatwoot vX.Y.Z-ce digest}
    profiles: [channels]
    entrypoint: docker/entrypoints/rails.sh
    command: [bundle, exec, rails, s, -p, "3000", -b, 0.0.0.0]
    env_file: [./secrets/chatwoot.env]
    volumes: [chatwoot:/app/storage]
    networks: [data, frontend]
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
  chatwoot-worker:
    <<: *app
    image: ${CHATWOOT_IMAGE:?Set reviewed Chatwoot vX.Y.Z-ce digest}
    profiles: [channels]
    entrypoint: docker/entrypoints/rails.sh
    command: [bundle, exec, sidekiq, -C, config/sidekiq.yml]
    env_file: [./secrets/chatwoot.env]
    volumes: [chatwoot:/app/storage]
    networks: [data, egress]
    depends_on: [chatwoot]
  astpp-db:
    <<: *app
    image: ${MARIADB_IMAGE:?Set reviewed MariaDB digest for selected ASTPP release}
    profiles: [astpp]
    environment:
      MARIADB_DATABASE: astpp
      MARIADB_USER: astpp
      MARIADB_PASSWORD_FILE: /run/secrets/astpp_db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
    secrets: [astpp_db_password, mariadb_root_password]
    volumes: [astpp-db:/var/lib/mysql]
    networks: [billing]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      retries: 12
  astpp:
    <<: *app
    # No invented public ASTPP image. Supply an internally built/audited CE image.
    # Its runtime contract and missing adapter are documented in docs/ASTPP.md.
    image: ${ASTPP_IMAGE:?Set internally built ASTPP CE image digest}
    profiles: [astpp]
    env_file: [./secrets/astpp.env]
    volumes: [./deploy/astpp:/etc/astpp:ro, astpp-data:/var/lib/astpp]
    networks: [billing, egress]
    ports: ["127.0.0.1:8088:80"]
    depends_on:
      astpp-db: {condition: service_healthy}
networks:
  data: {internal: true}
  frontend: {}
  billing: {internal: true}
  egress: {}
volumes:
  postgres: {}
  redis: {}
  chatwoot: {}
  astpp-db: {}
  astpp-data: {}
secrets:
  pg_admin_password: {file: ./secrets/pg_admin_password}
  redis_acl: {file: ./secrets/redis.acl}
  astpp_db_password: {file: ./secrets/astpp_db_password}
  mariadb_root_password: {file: ./secrets/mariadb_root_password}
