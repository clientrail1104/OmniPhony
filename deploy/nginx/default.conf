map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
 listen 443 ssl;
 server_name workspace.example.org;
 ssl_certificate /etc/nginx/certs/fullchain.pem;
 ssl_certificate_key /etc/nginx/certs/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Permissions-Policy "microphone=(self), camera=()" always;
 client_max_body_size 1m;
 location /v1/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
 location /events {
  proxy_pass http://api:8080; proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Origin $http_origin;
  proxy_read_timeout 75s;
 }
 location / { proxy_pass http://web:80; }
}
# Chatwoot: create a SEPARATE TLS vhost chat.example.org -> chatwoot:3000 when
# channels profile is enabled. Use Chatwoot upstream template cited in docs/SOURCES.md.
# Do not disable X-Frame-Options to embed Chatwoot. Use server-side API integration.
